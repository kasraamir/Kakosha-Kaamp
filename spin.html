<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>گردونه شانس | کاکوشا</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=10">
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        /* استایل اختصاصی گردونه چرخشی */
        .wheel-wrapper {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 30px auto;
        }

        .wheel-center-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background-color: var(--orange);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            z-index: 10;
            box-shadow: 0 0 20px rgba(255, 107, 0, 0.8), inset 0 0 10px rgba(255, 255, 255, 0.5);
            transition: transform 0.2s, background-color 0.2s;
            border: 3px solid #fff;
        }

        .wheel-center-btn:hover {
            transform: translate(-50%, -50%) scale(1.05);
            background-color: #ff8a33;
        }

        .wheel-pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid var(--orange);
            z-index: 20;
            filter: drop-shadow(0 4px 4px rgba(0,0,0,0.5));
        }

        #wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 5px solid #fff;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
            transition: transform 5s cubic-bezier(0.17, 0.67, 0.1, 1);
            transform: rotate(0deg);
        }

        .wheel-slice {
            position: absolute;
            width: 50%;
            height: 50%;
            transform-origin: bottom right;
            background-color: #0b3024;
            left: 0;
            top: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .wheel-text-span {
            position: absolute;
            left: 20%;
            top: 40%;
            transform: rotate(90deg);
            font-size: 14px;
            font-weight: bold;
            color: white;
            width: 100px;
            text-align: center;
            pointer-events: none;
        }

        .slice-0 { transform: rotate(0deg) skewY(-54deg); }
        .slice-1 { transform: rotate(36deg) skewY(-54deg); }
        .slice-2 { transform: rotate(72deg) skewY(-54deg); }
        .slice-3 { transform: rotate(108deg) skewY(-54deg); }
        .slice-4 { transform: rotate(144deg) skewY(-54deg); }
        .slice-5 { transform: rotate(180deg) skewY(-54deg); }
        .slice-6 { transform: rotate(216deg) skewY(-54deg); }
        .slice-7 { transform: rotate(252deg) skewY(-54deg); }
        .slice-8 { transform: rotate(288deg) skewY(-54deg); }
        .slice-9 { transform: rotate(324deg) skewY(-54deg); }

        .slice-0, .slice-2, .slice-4, .slice-6, .slice-8 { background-color: #0b3024; }
        .slice-1, .slice-3, .slice-5, .slice-7, .slice-9 { background-color: #1a4a3a; }

        .wheel-text-span span {
            transform: skewY(54deg) rotate(45deg);
            display: block;
            margin-top: 20px;
            margin-right: 10px;
        }
    </style>
</head>
<body>

    <header class="site-header">
        <div class="header-right">
            <a href="./" class="logo">
                <img src="logo.png" alt="لوگوی کاکوشا">
            </a>
        </div>
        <nav class="nav-menu">
            <a href="./">بازگشت به خانه</a>
        </nav>
    </header>

    <main>
        <section class="page-container" style="justify-content: center;">
            <div class="wheel-container" style="text-align: center; background: rgba(2, 26, 18, 0.7); border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px); padding: 40px 20px; border-radius: 20px; box-shadow: 0 25px 50px rgba(0,0,0,0.6); max-width: 400px; width: 100%;">
                
                <h1 class="wheel-title" style="color: var(--orange); font-size: 28px; margin-bottom: 10px;">گردونه شانس</h1>
                <p class="wheel-subtitle" style="color: var(--text-muted); font-size: 14px; margin-bottom: 20px;">شانستو امتحان کن!</p>
                
                <div class="wheel-wrapper">
                    <div class="wheel-pointer"></div>
                    <div id="wheel"></div>
                    <div class="wheel-center-btn" id="spinBtn">بچرخون!</div>
                </div>

                <div id="prizeMessage" style="display: none; margin-top: 20px; padding: 20px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 107, 0, 0.3); border-radius: 15px; animation: zoomIn 0.5s ease;">
                    <h3 id="prizeText" style="font-size: 20px; margin-bottom: 10px;"></h3>
                    <p id="prizeSubtext" style="color: var(--text-muted); font-size: 14px; line-height: 1.8;"></p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>© کاکوشا کمپ — تمامی حقوق محفوظ است.</p>
    </footer>

    <script>
        const segments = [
            { text: "پوچ", color: "#0b3024", isWin: false },
            { text: "۱۰٪ تخفیف", color: "#ff6b00", isWin: true, code: "KAKOSHA-10" },
            { text: "پوچ", color: "#0b3024", isWin: false },
            { text: "۱۵٪ تخفیف", color: "#0a6849", isWin: true, code: "KAKOSHA-15" },
            { text: "پوچ", color: "#0b3024", isWin: false },
            { text: "پوچ", color: "#0b3024", isWin: false },
            { text: "۵٪ تخفیف", color: "#ff6b00", isWin: true, code: "KAKOSHA-5" },
            { text: "پوچ", color: "#0b3024", isWin: false },
            { text: "۱۲٪ تخفیف", color: "#0a6849", isWin: true, code: "KAKOSHA-12" },
            { text: "پوچ", color: "#0b3024", isWin: false }
        ];

        const wheelEl = document.getElementById('wheel');
        const spinBtn = document.getElementById('spinBtn');
        const prizeMessage = document.getElementById('prizeMessage');
        const prizeText = document.getElementById('prizeText');
        const prizeSubtext = document.getElementById('prizeSubtext');

        let isSpinning = false;
        let currentRotation = 0;

        function buildWheel() {
            segments.forEach((segment, index) => {
                const slice = document.createElement('div');
                slice.className = `wheel-slice slice-${index}`;
                slice.style.backgroundColor = segment.color;
                const textSpan = document.createElement('div');
                textSpan.className = 'wheel-text-span';
                textSpan.innerHTML = `<span>${segment.text}</span>`;
                slice.appendChild(textSpan);
                wheelEl.appendChild(slice);
            });
        }
        buildWheel();

        function spinWheel() {
            if (isSpinning) return;
            isSpinning = true;
            prizeMessage.style.display = 'none';
            spinBtn.innerText = "...";

            let winIndex;
            if (Math.random() < 0.65) {
                const emptyIndices = segments.map((s, i) => s.isWin === false ? i : -1).filter(i => i !== -1);
                winIndex = emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
            } else {
                const winIndices = segments.map((s, i) => s.isWin === true ? i : -1).filter(i => i !== -1);
                winIndex = winIndices[Math.floor(Math.random() * winIndices.length)];
            }

            const spinDegrees = 360 * 5;
            const targetAngle = spinDegrees + (360 - (winIndex * 36)) + 18;

            currentRotation += targetAngle;
            wheelEl.style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                isSpinning = false;
                spinBtn.innerText = "استفاده شده";
                spinBtn.style.pointerEvents = 'none';
                localStorage.setItem('hasSpunWheel', 'true');
                showPrize(segments[winIndex]);
            }, 5000);
        }

        function showPrize(prize) {
            prizeMessage.style.display = 'block';

            if (!prize.isWin) {
                prizeText.innerText = "ای وای! 😢";
                prizeText.style.color = "#b9c9bf";
                prizeSubtext.innerText = "این بار شانس با شما یار نبود. دفعه بعد قطعاً برنده میشید!";
            } else {
                confetti({
                    particleCount: 150,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#ff6b00', '#ffffff', '#0a6849']
                });

                prizeText.innerText = "🎉 تبریک! شما برنده شدید 🎉";
                prizeText.style.color = "#ff6b00";
                prizeSubtext.innerHTML = `شما موفق شدید <strong>${prize.text}</strong> بگیرید.<br>
                کد تخفیف اختصاصی شما: <br>
                <strong style="font-size: 20px; color: #fff; letter-spacing: 2px; display: inline-block; margin-top: 10px; border: 1px dashed var(--orange); padding: 5px 15px; border-radius: 5px;">${prize.code}</strong><br>
                <span style="font-size: 12px; margin-top: 10px; display: block;">این کد را به مدیر (${'@JudgeKY'}) ارسال کنید.</span>`;
            }
        }

        spinBtn.addEventListener('click', spinWheel);

        window.onload = () => {
            if (localStorage.getItem('hasSpunWheel') === 'true') {
                spinBtn.style.pointerEvents = 'none';
                spinBtn.innerText = "قبلاً چرخوندی";
                spinBtn.style.opacity = '0.5';
            }
        };
    </script>
</body>
</html>
