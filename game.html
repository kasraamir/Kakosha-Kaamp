<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>گردونه شانس | کاکوشا</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=100">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        .wheel-wrapper {
            position: relative; width: 320px; height: 320px;
            margin: 30px auto; filter: drop-shadow(0 0 20px rgba(255, 107, 0, 0.2));
        }
        .wheel-center-btn {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 85px; height: 85px; background: radial-gradient(circle, #ff8a33, #ff6b00);
            color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 16px; cursor: pointer; z-index: 10;
            box-shadow: 0 0 25px rgba(255, 107, 0, 0.8), inset 0 -3px 10px rgba(0,0,0,0.3), inset 0 3px 10px rgba(255,255,255,0.5);
            transition: transform 0.2s; border: 4px solid #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        .wheel-center-btn:hover { transform: translate(-50%, -50%) scale(1.05); }
        .wheel-pointer {
            position: absolute; top: -25px; left: 50%; transform: translateX(-50%);
            width: 0; height: 0; border-left: 18px solid transparent; border-right: 18px solid transparent;
            border-top: 35px solid var(--orange); z-index: 20; filter: drop-shadow(0 5px 5px rgba(0,0,0,0.5));
        }
        .wheel-pointer::after {
            content: ''; position: absolute; top: -35px; left: -10px; width: 20px; height: 20px;
            background: var(--orange); border-radius: 50%; border: 3px solid #fff;
        }
        #wheel {
            width: 100%; height: 100%; border-radius: 50%; border: 6px solid #fff;
            box-shadow: 0 0 30px rgba(0,0,0,0.8), inset 0 0 20px rgba(0,0,0,0.5);
            position: relative; overflow: hidden; transition: transform 5s cubic-bezier(0.17, 0.67, 0.1, 1);
            transform: rotate(0deg); background-color: #03251b;
        }
        .wheel-slice {
            position: absolute; width: 50%; height: 50%; transform-origin: bottom right; left: 0; top: 0;
            display: flex; align-items: center; justify-content: center;
            border-right: 2px solid rgba(255, 107, 0, 0.3); border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .wheel-text-span {
            position: absolute; left: 15%; top: 45%; transform: rotate(90deg);
            font-size: 13px; font-weight: 800; color: #fff; width: 90px; text-align: center;
            pointer-events: none; text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        .slice-0 { transform: rotate(0deg) skewY(-54deg); } .slice-1 { transform: rotate(36deg) skewY(-54deg); }
        .slice-2 { transform: rotate(72deg) skewY(-54deg); } .slice-3 { transform: rotate(108deg) skewY(-54deg); }
        .slice-4 { transform: rotate(144deg) skewY(-54deg); } .slice-5 { transform: rotate(180deg) skewY(-54deg); }
        .slice-6 { transform: rotate(216deg) skewY(-54deg); } .slice-7 { transform: rotate(252deg) skewY(-54deg); }
        .slice-8 { transform: rotate(288deg) skewY(-54deg); } .slice-9 { transform: rotate(324deg) skewY(-54deg); }
        .slice-0, .slice-2, .slice-4, .slice-6, .slice-8 { background: linear-gradient(135deg, #0b3024, #042b20); }
        .slice-1, .slice-3, .slice-5, .slice-7, .slice-9 { background: linear-gradient(135deg, #1a4a3a, #0a6849); }
        .wheel-text-span span { transform: skewY(54deg) rotate(45deg); display: block; margin-top: 25px; margin-right: 5px; }
        .prize-box { margin-top: 25px; padding: 25px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 107, 0, 0.4); border-radius: 15px; display: none; }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="header-right"><a href="./" class="logo"><img src="logo.png" alt="لوگوی کاکوشا"></a></div>
        <nav class="nav-menu"><a href="./">بازگشت به خانه</a></nav>
    </header>
    <main>
        <section class="page-container" style="justify-content: center; padding-top: 40px;">
            <div class="wheel-container" style="text-align: center; background: rgba(2, 26, 18, 0.7); border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px); padding: 40px 20px; border-radius: 20px; max-width: 400px; width: 100%;">
                <h1 class="wheel-title" style="color: var(--orange); font-size: 28px; margin-bottom: 5px;">گردونه شانس</h1>
                <p class="wheel-subtitle" style="color: var(--text-muted); font-size: 14px; margin-bottom: 30px;">شانستو امتحان کن!</p>
                <div class="wheel-wrapper">
                    <div class="wheel-pointer"></div>
                    <div id="wheel"></div>
                    <div class="wheel-center-btn" id="spinBtn">بچرخون!</div>
                </div>
                <div id="prizeMessage" class="prize-box">
                    <h3 id="prizeText" style="font-size: 22px; margin-bottom: 10px;"></h3>
                    <p id="prizeSubtext" style="color: var(--text-muted); font-size: 14px; line-height: 1.8;"></p>
                </div>
            </div>
        </section>
    </main>
    <footer><p>© کاکوشا کمپ — تمامی حقوق محفوظ است.</p></footer>

    <script>
        const segments = [
            { text: "پوچ", isWin: false }, { text: "۱۰٪ تخفیف", isWin: true, code: "KAKOSHA-10" },
            { text: "پوچ", isWin: false }, { text: "۱۵٪ تخفیف", isWin: true, code: "KAKOSHA-15" },
            { text: "پوچ", isWin: false }, { text: "پوچ", isWin: false },
            { text: "۵٪ تخفیف", isWin: true, code: "KAKOSHA-5" },
            { text: "پوچ", isWin: false }, { text: "۱۲٪ تخفیف", isWin: true, code: "KAKOSHA-12" },
            { text: "پوچ", isWin: false }
        ];
        const wheelEl = document.getElementById('wheel');
        const spinBtn = document.getElementById('spinBtn');
        const prizeMessage = document.getElementById('prizeMessage');
        const prizeText = document.getElementById('prizeText');
        const prizeSubtext = document.getElementById('prizeSubtext');
        let isSpinning = false;
        let currentRotation = 0; 

        segments.forEach((segment, index) => {
            const slice = document.createElement('div');
            slice.className = `wheel-slice slice-${index}`;
            slice.innerHTML = `<div class="wheel-text-span"><span>${segment.text}</span></div>`;
            wheelEl.appendChild(slice);
        });

        spinBtn.addEventListener('click', () => {
            if (isSpinning) return;
            isSpinning = true;
            prizeMessage.style.display = 'none';
            spinBtn.innerText = "...";
            let winIndex;
            if (Math.random() < 0.65) {
                const emptyIndices = segments.map((s, i) => !s.isWin ? i : -1).filter(i => i !== -1);
                winIndex = emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
            } else {
                const winIndices = segments.map((s, i) => s.isWin ? i : -1).filter(i => i !== -1);
                winIndex = winIndices[Math.floor(Math.random() * winIndices.length)];
            }
            const targetAngle = (360 * 6) + (360 - (winIndex * 36)) - 18;
            currentRotation += targetAngle;
            wheelEl.style.transform = `rotate(${currentRotation}deg)`;
            setTimeout(() => {
                isSpinning = false;
                spinBtn.innerText = "استفاده شده";
                spinBtn.style.pointerEvents = 'none';
                localStorage.setItem('hasSpunWheel', 'true');
                const prize = segments[winIndex];
                prizeMessage.style.display = 'block';
                if (!prize.isWin) {
                    prizeText.innerText = "ای وای! 😢";
                    prizeText.style.color = "#b9c9bf";
                    prizeSubtext.innerText = "این بار شانس با شما یار نبود.";
                } else {
                    confetti({ particleCount: 200, spread: 90, origin: { y: 0.6 }, colors: ['#ff6b00', '#fff', '#0a6849'] });
                    prizeText.innerText = "🎉 تبریک! برنده شدید 🎉";
                    prizeText.style.color = "var(--orange)";
                    prizeSubtext.innerHTML = `شما <strong>${prize.text}</strong> گرفتید.<br>کد تخفیف: <br><strong style="font-size: 22px; color: #fff; letter-spacing: 2px; display: inline-block; margin: 15px 0; border: 2px dashed var(--orange); padding: 8px 20px; border-radius: 8px;">${prize.code}</strong>`;
                }
            }, 5000);
        });

        window.onload = () => {
            if (localStorage.getItem('hasSpunWheel') === 'true') {
                spinBtn.style.pointerEvents = 'none';
                spinBtn.innerText = "قبلاً چرخوندی";
                spinBtn.style.opacity = '0.6';
            }
        };
    </script>
</body>
</html>
