<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>گردونه شانس | کاکوشا</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/wheel-of-fortune@1.0.0/dist/wheel.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

    <header class="site-header">
        <div class="header-right">
            <a href="./" class="logo">
                <img src="logo.png" alt="لوگوی کاکوشا">
            </a>
        </div>
        <nav class="nav-menu">
            <a href="./">بازگشت به خانه</a>
        </nav>
    </header>

    <main>
        <section class="page-container" style="justify-content: center;">
            <div class="wheel-container">
                <h1 class="wheel-title">گردونه شانس کاکوشا</h1>
                <p class="wheel-subtitle" id="statusText">برای شروع، دکمه زیر را فشار دهید</p>
                
                <div id="wheel" style="margin: 30px auto; position: relative;"></div>
                
                <!-- دکمه‌های کنترل -->
                <div style="display: flex; flex-direction: column; gap: 15px; align-items: center; margin-top: 20px;">
                    <!-- دکمه فعال سازی (اول نمایش داده میشه) -->
                    <button id="enableSensorBtn" class="btn spin-btn" style="width: 100%; max-width: 300px;">📱 فعال‌سازی سنسور حرکت</button>
                    
                    <!-- دکمه چرخش دستی (اول مخفیه) -->
                    <button id="spinBtn" class="btn spin-btn" style="display: none; width: 100%; max-width: 300px;">بچرخون!</button>
                </div>

                <div id="prizeMessage" class="prize-message" style="display: none;">
                    <h3 id="prizeText"></h3>
                    <p id="prizeSubtext"></p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>© کاکوشا کمپ — تمامی حقوق محفوظ است.</p>
    </footer>

    <script>
        const segments = [
            "پوچ", "۱۰٪ تخفیف", "پوچ", "۱۵٪ تخفیف", "پوچ", 
            "پوچ", "۵٪ تخفیف", "پوچ", "۱۲٪ تخفیف", "پوچ"
        ];

        const colors = [
            "#0b3024", "#ff6b00", "#0b3024", "#0a6849", "#0b3024", 
            "#0b3024", "#ff6b00", "#0b3024", "#0a6849", "#0b3024"
        ];

        let isSpinning = false;
        let sensorEnabled = false;

        // تعریف گردونه
        const wheel = new Wheel({
            el: document.getElementById('wheel'),
            items: segments,
            colors: colors,
            fontSize: 16,
            fontColor: "#fff",
            radius: 150,
            onSpin: (item) => {
                isSpinning = true;
                document.getElementById('spinBtn').disabled = true;
                document.getElementById('enableSensorBtn').disabled = true;
                document.getElementById('statusText').innerText = "در حال چرخش...";
            },
            onEnd: (item) => {
                isSpinning = false;
                showPrize(item);
                document.getElementById('spinBtn').innerText = "استفاده شده";
                document.getElementById('enableSensorBtn').style.display = 'none';
                document.getElementById('spinBtn').style.display = 'block';
                document.getElementById('spinBtn').disabled = true;
                localStorage.setItem('hasSpunWheel', 'true');
            }
        });

        // دکمه چرخش دستی
        document.getElementById('spinBtn').addEventListener('click', () => {
            if (isSpinning) return;
            spinWheel();
        });

        function spinWheel() {
            let randomIndex = Math.floor(Math.random() * segments.length);
            // ۶۵ درصد احتمال پوچ
            if(Math.random() < 0.65) { 
                const emptyIndices = [0, 2, 4, 5, 7, 9];
                randomIndex = emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
            }
            wheel.spin(randomIndex);
        }

        function showPrize(prize) {
            const prizeBox = document.getElementById('prizeMessage');
            const prizeText = document.getElementById('prizeText');
            const prizeSubtext = document.getElementById('prizeSubtext');
            
            prizeBox.style.display = 'block';
            document.getElementById('statusText').innerText = "نتیجه مشخص شد!";

            if (prize === "پوچ") {
                prizeText.innerText = "ای وای! 😢";
                prizeText.style.color = "#b9c9bf";
                prizeSubtext.innerText = "این بار شانس با شما یار نبود. دفعه بعد قطعاً برنده میشید!";
            } else {
                confetti({
                    particleCount: 150,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#ff6b00', '#ffffff', '#0a6849']
                });

                prizeText.innerText = "🎉 تبریک! شما برنده شدید 🎉";
                prizeText.style.color = "#ff6b00";
                prizeSubtext.innerHTML = `شما موفق شدید <strong>${prize}</strong> برای سفر بعدی بگیرید.<br>برای استفاده، این پیام را به مدیر (${'@JudgeKY'}) نشان دهید.`;
            }
        }

        // ==========================================
        // 📱 بخش فعال‌سازی سنسور (مهم)
        // ==========================================
        
        document.getElementById('enableSensorBtn').addEventListener('click', async () => {
            // درخواست اجازه از مرورگر (برای iOS)
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const permission = await DeviceOrientationEvent.requestPermission();
                    if (permission === 'granted') {
                        startSensorMode();
                    } else {
                        alert("شما اجازه دسترسی به سنسور را ندادید. می‌توانید از دکمه چرخش استفاده کنید.");
                        showManualSpinBtn();
                    }
                } catch (error) {
                    console.error("Sensor error:", error);
                    showManualSpinBtn();
                }
            } else {
                // برای اندروید
                startSensorMode();
            }
        });

        function startSensorMode() {
            sensorEnabled = true;
            document.getElementById('enableSensorBtn').style.display = 'none';
            document.getElementById('spinBtn').style.display = 'block';
            document.getElementById('spinBtn').innerText = "یا اینجا کلیک کنید";
            document.getElementById('spinBtn').style.backgroundColor = "transparent";
            document.getElementById('spinBtn').style.border = "1px solid var(--orange)";
            document.getElementById('spinBtn').style.color = "var(--orange)";
            
            document.getElementById('statusText').innerText = "📱 حالا گوشی را به چپ و راست کج کنید تا گردونه بچرخد!";
            
            // گوش دادن به حرکت گوشی
            window.addEventListener('deviceorientation', handleOrientation);
        }

        function showManualSpinBtn() {
            document.getElementById('enableSensorBtn').style.display = 'none';
            document.getElementById('spinBtn').style.display = 'block';
            document.getElementById('spinBtn').innerText = "بچرخون!";
        }

        let lastShakeTime = 0;

        function handleOrientation(event) {
            if (!sensorEnabled || isSpinning) return;

            // زاویه کج شدن گوشی به چپ و راست
            const tilt = event.gamma; 
            
            // اگر بیش از ۲۵ درجه کج شد و ۲ ثانیه از چرخش قبلی گذشته بود
            if (Math.abs(tilt) > 25) {
                const now = Date.now();
                if (now - lastShakeTime > 2000) {
                    lastShakeTime = now;
                    spinWheel();
                }
            }
        }

        // چک کردن اینکه کاربر قبلا استفاده کرده یا نه
        window.onload = () => {
            if (localStorage.getItem('hasSpunWheel') === 'true') {
                document.getElementById('enableSensorBtn').style.display = 'none';
                document.getElementById('spinBtn').style.display = 'block';
                document.getElementById('spinBtn').disabled = true;
                document.getElementById('spinBtn').innerText = "شما قبلاً استفاده کرده‌اید";
                document.getElementById('statusText').innerText = "شما قبلاً از شانس خود استفاده کرده‌اید.";
            }
        };
    </script>
</body>
</html>
