<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>گردونه شانس | کاکوشا</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <!-- لود کردن کتابخانه گردونه و افکت کانفتی (جشن) -->
    <script src="https://cdn.jsdelivr.net/npm/wheel-of-fortune@1.0.0/dist/wheel.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

    <header class="site-header">
        <div class="header-right">
            <a href="./" class="logo">
                <img src="logo.png" alt="لوگوی کاکوشا">
            </a>
        </div>
        <nav class="nav-menu">
            <a href="./">بازگشت به خانه</a>
        </nav>
    </header>

    <main>
        <section class="page-container" style="justify-content: center;">
            <div class="wheel-container">
                <h1 class="wheel-title">گردونه شانس کاکوشا</h1>
                <p class="wheel-subtitle">گوشی رو کج کن تا گردونه بچرخه!</p>
                
                <!-- محل قرارگیری گردونه -->
                <div id="wheel" style="margin: 30px auto; position: relative;"></div>
                
                <!-- دکمه‌های کنترل -->
                <div style="display: flex; gap: 10px; justify-content: center; margin-top: 20px; flex-wrap: wrap;">
                    <button id="enableSensorBtn" class="btn spin-btn" style="background-color: var(--primary);">📱 فعال‌سازی سنسور حرکت</button>
                    <button id="spinBtn" class="btn spin-btn" style="display: none;">بچرخون!</button>
                </div>

                <!-- بخش نمایش جایزه -->
                <div id="prizeMessage" class="prize-message" style="display: none;">
                    <h3 id="prizeText"></h3>
                    <p id="prizeSubtext"></p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>© کاکوشا کمپ — تمامی حقوق محفوظ است.</p>
    </footer>

    <script>
        // ۱۰ خونه: ۶ تا پوچ، ۴ تا تخفیف
        const segments = [
            "پوچ",       // 0
            "۱۰٪ تخفیف", // 1
            "پوچ",       // 2
            "۱۵٪ تخفیف", // 3
            "پوچ",       // 4
            "پوچ",       // 5
            "۵٪ تخفیف",  // 6
            "پوچ",       // 7
            "۱۲٪ تخفیف", // 8
            "پوچ"        // 9
        ];

        const colors = [
            "#0b3024", "#ff6b00", "#0b3024", "#0a6849", "#0b3024", 
            "#0b3024", "#ff6b00", "#0b3024", "#0a6849", "#0b3024"
        ];

        let isSpinning = false;
        let sensorEnabled = false;

        const wheel = new Wheel({
            el: document.getElementById('wheel'),
            items: segments,
            colors: colors,
            fontSize: 16,
            fontColor: "#fff",
            radius: 150,
            onSpin: (item) => {
                isSpinning = true;
                document.getElementById('spinBtn').disabled = true;
            },
            onEnd: (item) => {
                isSpinning = false;
                showPrize(item);
                document.getElementById('spinBtn').disabled = true;
                document.getElementById('spinBtn').innerText = "استفاده شده";
                document.getElementById('enableSensorBtn').style.display = 'none';
                localStorage.setItem('hasSpunWheel', 'true');
            }
        });

        // چرخش با دکمه (اگر سنسور فعال نباشه)
        document.getElementById('spinBtn').addEventListener('click', () => {
            if (isSpinning) return;
            spinWheel();
        });

        function spinWheel() {
            let randomIndex = Math.floor(Math.random() * segments.length);
            // بایاس: ۶۵٪ شانس افتادن روی پوچ
            if(Math.random() < 0.65) { 
                const emptyIndices = [0, 2, 4, 5, 7, 9];
                randomIndex = emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
            }
            wheel.spin(randomIndex);
        }

        function showPrize(prize) {
            const prizeBox = document.getElementById('prizeMessage');
            const prizeText = document.getElementById('prizeText');
            const prizeSubtext = document.getElementById('prizeSubtext');
            
            prizeBox.style.display = 'block';

            if (prize === "پوچ") {
                prizeText.innerText = "ای وای! 😢";
                prizeText.style.color = "#b9c9bf";
                prizeSubtext.innerText = "این بار شانس با شما یار نبود. دفعه بعد قطعاً برنده میشید!";
            } else {
                confetti({
                    particleCount: 150,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#ff6b00', '#ffffff', '#0a6849']
                });

                prizeText.innerText = "🎉 تبریک! شما برنده شدید 🎉";
                prizeText.style.color = "#ff6b00";
                prizeSubtext.innerHTML = `شما موفق شدید <strong>${prize}</strong> برای سفر بعدی بگیرید.<br>برای استفاده، این پیام را به مدیر (${'@JudgeKY'}) نشان دهید.`;
            }
        }

        // ==========================================
        // 📱 بخش کدهای مربوط به سنسور حرکت گوشی
        // ==========================================
        
        document.getElementById('enableSensorBtn').addEventListener('click', async () => {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                // برای دستگاه‌های iOS (آیفون)
                try {
                    const permission = await DeviceOrientationEvent.requestPermission();
                    if (permission === 'granted') {
                        enableSensor();
                    } else {
                        alert("اجازه دسترسی به سنسور داده نشد. می‌توانید از دکمه بچرخون استفاده کنید.");
                    }
                } catch (error) {
                    console.error(error);
                    alert("خطا در فعال‌سازی سنسور.");
                }
            } else {
                // برای اندروید و سایر دستگاه‌ها
                enableSensor();
            }
        });

        function enableSensor() {
            sensorEnabled = true;
            document.getElementById('enableSensorBtn').style.display = 'none';
            document.getElementById('spinBtn').style.display = 'block';
            document.getElementById('spinBtn').innerText = "یا گوشی را کج کنید!";
            document.getElementById('spinBtn').style.backgroundColor = "var(--dark-green)";
            document.getElementById('spinBtn').style.border = "1px solid var(--orange)";

            window.addEventListener('deviceorientation', handleOrientation);
            
            // اضافه کردن یه متن راهنما
            document.querySelector('.wheel-subtitle').innerText = "حالا گوشی رو به چپ و راست کج کن تا بچرخه! 📱";
        }

        let lastShakeTime = 0;

        function handleOrientation(event) {
            if (!sensorEnabled || isSpinning) return;

            // محاسبه میزان کج شدن گوشی (چپ و راست)
            // event.gamma زاویه کج شدن به چپ و راست رو میده (بین -90 تا 90)
            const tilt = event.gamma; 
            
            // اگر گوشی بیشتر از ۲۰ درجه کج شد و از آخرین چرخش ۲ ثانیه گذشته بود
            if (Math.abs(tilt) > 20) {
                const now = Date.now();
                if (now - lastShakeTime > 2000) {
                    lastShakeTime = now;
                    spinWheel();
                }
            }
        }

        // چک کردن قفل بودن در بدو ورود
        window.onload = () => {
            if (localStorage.getItem('hasSpunWheel') === 'true') {
                document.getElementById('enableSensorBtn').style.display = 'none';
                document.getElementById('spinBtn').style.display = 'block';
                document.getElementById('spinBtn').disabled = true;
                document.getElementById('spinBtn').innerText = "شما قبلاً استفاده کرده‌اید";
                
                setTimeout(() => {
                    alert("شما قبلاً از شانس خود برای این کمپ استفاده کرده‌اید. منتظر کمپ‌های بعدی ما باشید! 🌿");
                }, 500);
            }
        };
    </script>
</body>
</html>
